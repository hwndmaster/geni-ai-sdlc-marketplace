name: CI

on:
  push:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      ATOM_PKG_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Authenticate GitHub Packages for NuGet
        run: dotnet nuget update source github --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --configfile nuget.config

      # pnpm version is read from the "packageManager" field in {{SolutionName}}.Web/package.json —
      # single source of truth, so a version bump there never drifts from CI.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: {{SolutionName}}.Web/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: {{SolutionName}}.Web/pnpm-lock.yaml

      - name: Restore .NET tools
        run: dotnet tool restore --configfile nuget.config

      - name: Restore .NET dependencies
        run: dotnet restore {{SolutionName}}.slnx --configfile nuget.config

      - name: Build .NET
        run: dotnet build {{SolutionName}}.slnx --configuration Release --no-restore

      - name: Test .NET
        run: dotnet test {{SolutionName}}.slnx --configuration Release --no-build --verbosity normal

      # pnpm >=11.9 ignores env-var credentials in the project .npmrc, so the token
      # is written to the user-level ~/.npmrc that pnpm actually reads.
      - name: Authenticate GitHub Packages for pnpm
        run: echo "//npm.pkg.github.com/:_authToken=${ATOM_PKG_ACCESS_TOKEN}" >> ~/.npmrc

      - name: Restore web dependencies
        working-directory: {{SolutionName}}.Web
        run: pnpm install --frozen-lockfile

      - name: Lint web
        working-directory: {{SolutionName}}.Web
        run: pnpm lint

      - name: Build web
        working-directory: {{SolutionName}}.Web
        run: pnpm build

      - name: Test web
        working-directory: {{SolutionName}}.Web
        run: pnpm test -- --run

  audit:
    name: Audit web dependencies
    runs-on: ubuntu-latest
    env:
      ATOM_PKG_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: {{SolutionName}}.Web/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: {{SolutionName}}.Web/pnpm-lock.yaml

      # Gate: production dependencies ship to the browser, so a high/critical advisory
      # there fails the pipeline. Reads pnpm-lock.yaml directly (no install needed).
      - name: Audit production dependencies (fail on high/critical)
        working-directory: {{SolutionName}}.Web
        run: pnpm audit --prod --audit-level high

      # Visibility: surface every advisory (all deps, all severities) without gating CI,
      # so dev-dependency and lower-severity issues are still reported in the logs.
      - name: Audit all dependencies (report-only)
        if: always()
        continue-on-error: true
        working-directory: {{SolutionName}}.Web
        run: pnpm audit --audit-level low
