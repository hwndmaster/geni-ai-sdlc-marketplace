# Builds the images (publish-docker.ps1) and can run them locally. On the server the shared app host runs
# them instead, from Deployment/app.json.
services:
  {{ServicePrefix}}-api:
    build:
      context: .                          # Root, so all projects are in scope
      dockerfile: {{SolutionName}}.WebApi/Dockerfile
      secrets:
        - atom_pkg_access_token
    container_name: {{ServicePrefix}}-api
    ports:
      - "{{ApiHostPort}}:{{ApiContainerPort}}"
    environment:
      # The shared app host's OTLP port, when one runs on this machine. Without it the exporter drops the
      # telemetry and the API runs as usual.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:21100
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SERVICE_NAME: {{ServicePrefix}}-api
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Docker Desktop resolves it by itself; a Linux daemon does not
    volumes:
      - {{DataVolumePath}}:/app/Data      # Persist SQLite database
      - {{LogsVolumePath}}:/app/Logs      # Persist API error logs
    restart: unless-stopped

  {{ServicePrefix}}-web:
    build:
      context: ./{{SolutionName}}.Web
      dockerfile: Dockerfile
      secrets:
        - atom_pkg_access_token
    container_name: {{ServicePrefix}}-web
    ports:
      - "{{WebHostPort}}:{{WebContainerPort}}"
    depends_on:
      - {{ServicePrefix}}-api
    restart: unless-stopped

secrets:
  atom_pkg_access_token:
    environment: ATOM_PKG_ACCESS_TOKEN
